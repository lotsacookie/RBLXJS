<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RBLXJS Client</title>
<style>
@font-face { font-family: "Source Sans Pro"; font-weight: 400; src: url(assets/fonts/SourceSansPro-Regular.ttf) format("truetype"); }
@font-face { font-family: "Source Sans Pro"; font-weight: 700; src: url(assets/fonts/SourceSansPro-Bold.ttf) format("truetype"); }
@font-face { font-family: "Source Sans Pro"; font-weight: 300; src: url(assets/fonts/SourceSansPro-Light.ttf) format("truetype"); }
html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: "Source Sans Pro", "Segoe UI", Arial, sans-serif; }
#stage { position: absolute; inset: 0; overflow: hidden; background: #000; }
#loading { position: absolute; inset: 0; z-index: 100; background: #1f1f1f; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; }
#loading img { width: 220px; max-width: 60vw; }
#status { font-size: 18px; font-weight: 700; }
#console { position: absolute; left: 0; bottom: 0; width: 100%; max-height: 40%; overflow: auto; background: rgba(0, 0, 0, 0.8); color: #ddd; font: 12px monospace; white-space: pre-wrap; display: none; z-index: 90; padding: 6px; box-sizing: border-box; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="loading"><img src="assets/textures/roblox-logo.png" alt=""><div id="status">Loading</div></div>
<div id="console"></div>
<script>
(function () {
    function add(src) {
        return new Promise(function (res, rej) {
            var s = document.createElement('script');
            s.src = src;
            s.onload = res;
            s.onerror = function () { rej(new Error('Failed to load ' + src)); };
            document.head.appendChild(s);
        });
    }
    function fail(e) { document.getElementById('status').textContent = e.message; }
    var chain = add('lib/three.min.js').catch(function () {
        return add('https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js');
    });
    ['rbx-lua.js', 'rbx-physics.js', 'rbx-runtime.js', 'rbx-parser.js', 'rbx-world.js', 'rbx-controller.js', 'rbx-hud.js', 'rbx-client.js'].forEach(function (f) {
        chain = chain.then(function () { return add(f); });
    });
    chain.catch(fail);
})();
</script>
</body>
</html>
